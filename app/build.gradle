plugins {
    id 'com.android.application'
}

android {
    namespace 'app.autolauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'app.autolauncher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Código reducido y ofuscado; sin modo depuración.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Firma local para instalar en tu pantalla. Para distribuir, usa tu propio keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

// Sin dependencias de terceros: solo el framework de Android.
dependencies {
}
