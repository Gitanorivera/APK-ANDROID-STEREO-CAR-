plugins {
    id 'com.android.application'
}

// En GitHub Actions cada compilación sube el número de versión, así sabes cuál está instalada.
def ciRun = System.getenv('GITHUB_RUN_NUMBER')
def ciRunNumber = ciRun != null && ciRun.isInteger() ? ciRun.toInteger() : 0

// Firma fija: solo si existen las variables (las pone el workflow desde los secretos de GitHub).
// Sin ellas se usa la llave de depuración de la máquina, como antes. Nunca pongas valores aquí.
def releaseKeystore = System.getenv('KEYSTORE_FILE')

android {
    namespace 'app.autolauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'app.autolauncher'
        minSdk 26
        targetSdk 34
        versionCode(Math.max(1, ciRunNumber))
        versionName(ciRunNumber > 0 ? "2.${ciRunNumber}" : '2.0-local')
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Código reducido y ofuscado; sin modo depuración.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(releaseKeystore ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

// Sin dependencias de terceros: solo el framework de Android.
dependencies {
}
